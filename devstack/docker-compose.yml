# The Pi's InfluxDB + Grafana pair, reproduced on a workstation so the dashboard can be looked
# at from somewhere other than the Pi's own localhost.
#
# Image tags are pinned to the versions the Pi actually runs (measured by
# deploy/migrations/0007_probe_environment.sh, 2026-08-31). That parity is the point: Grafana
# migrates a dashboard's schemaVersion when it loads one written by a different major, so a
# "close enough" tag would render something the Pi never renders — which is exactly the kind of
# difference this stack exists to rule out.
name: pijardin-devstack

services:
  influxdb:
    image: influxdb:2.7.11
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: pijardin
      DOCKER_INFLUXDB_INIT_PASSWORD: pijardin-devstack
      DOCKER_INFLUXDB_INIT_ORG: ${DEV_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DEV_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DEV_TOKEN}
      ## Infinite retention, and not a detail: an export is history by definition, and a bucket
      ## with a finite retention would accept those writes and then quietly drop everything
      ## older than the window. You would import 30 days, see 7, and go looking for the bug in
      ## the exporter.
      DOCKER_INFLUXDB_INIT_RETENTION: 0
    ports:
      ## Bound to loopback deliberately. Docker publishes ports by writing its own iptables
      ## rules, which bypass a host firewall — a bare "8086:8086" would put this database, with
      ## the token committed next door in dev.env, on every network the machine is attached to.
      - "127.0.0.1:8086:8086"
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      ## Grafana provisions its datasource at startup; without this it can come up first and
      ## report the datasource as failed until something makes it retry.
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.0.2
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      ## No login screen. This is a throwaway stack on loopback; a password would protect
      ## nothing and stand between you and the panel you opened it for.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      ## The dashboards straight out of the repo, unmodified — the production provisioning file
      ## already points Grafana at /var/lib/grafana/dashboards, so this path needs no rewriting.
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      ## Generated by up.sh from the production files. Not mounted from grafana/provisioning
      ## directly because two values have to differ locally: the datasource URL (a compose
      ## service name, not localhost) and the token.
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana/data

volumes:
  influx-data:
  grafana-data:
