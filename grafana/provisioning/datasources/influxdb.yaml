apiVersion: 1
datasources:
  - name: InfluxDB PiJardin
    uid: influxdb-pijardin
    type: influxdb
    access: proxy
    url: http://localhost:8086
    jsonData:
      version: Flux
      organization: PiJardin
      defaultBucket: puit
    secureJsonData:
      # placeholder replaced from .env by deploy/deploy.sh — never commit the real token
      token: __INFLUXDB_TOKEN__
